[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hubsizing"
version = "0.1.0"
description = "Risk-aware battery sizing for a PV-and-storage EV charging hub"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "requests",
    "pyyaml",
    "scikit-learn",
    "ngboost",
    "numba>=0.63",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]